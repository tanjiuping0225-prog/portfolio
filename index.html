<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">

    <title>譚久平個人簡歷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a1a1a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .text-accent { color: #2dd4bf; }
        .bg-accent { background-color: #2dd4bf; }
        .border-accent { border-color: #2dd4bf; }
        [contenteditable]:focus { outline: 2px solid #2dd4bf; padding: 4px; border-radius: 4px; background: rgba(255,255,255,0.05); }
        .photo-preview { width: 128px; height: 128px; border-radius: 9999px; background-size: cover; background-position: center; border: 4px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-4xl mx-auto bg-[#262626] rounded-xl shadow-2xl overflow-hidden">
        
        <div class="p-8 flex flex-col md:flex-row gap-8 items-start justify-between">
            <!-- 左側個人資料 -->
            <div contenteditable="true" class="w-full space-y-4">

                    <p>📍 桃園市桃園區民光東路184號3樓</p>
                    <p>🎓 商信家商 - 餐旅</p>

            </div>

        </div>

        <div class="p-8 pt-0 grid grid-cols-1 md:grid-cols-3 gap-8">

                        <h3 class="font-bold">仲介業務</h3>
                        <p class="text-sm opacity-60">2005 - 2025</p>
                        <p class="mt-2 text-sm">長期深耕業務領域，具備優秀的銷售介紹產品能力與客戶應對經驗。</p>
                    </div>
                </div>

                <h2 class="text-2xl font-bold text-accent mt-12 mb-6">其他資訊</h2>
                <div class="bg-black/20 p-4 rounded-lg" contenteditable="true">
                    <ul class="list-disc pl-5 space-y-2 text-sm">
                        <li>美髮證照丙級</li>
                        <li>中餐廚師證照丙級</li>
                        <li>生成式 AI 應用專家</li>
                        <li>數據處理與自動化</li>
                    </ul>
                </div>
            </div>

            <!-- Right Column -->
            <div class="space-y-8">
                <div>
                    <h2 class="text-xl font-bold text-accent mb-4">聯絡方法</h2>
                    <div class="text-sm space-y-2" contenteditable="true">
                        <p>📞 0926-891-609</p>
                        <p class="break-all">✉️ Tanjiuping0225@gmail.com</p>
                    </div>
                </div>

                <div>
                    <h2 class="text-xl font-bold text-accent mb-4">核心專業</h2>
                    <div class="space-y-4" contenteditable="true">
                        <div><p class="text-xs mb-1">生成式 AI 應用</p><div class="w-full bg-black/30 h-2 rounded-full"><div class="bg-accent h-2 rounded-full w-[90%]"></div></div></div>
                        <div><p class="text-xs mb-1">數據處理與自動化</p><div class="w-full bg-black/30 h-2 rounded-full"><div class="bg-accent h-2 rounded-full w-[85%]"></div></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
